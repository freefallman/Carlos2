<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.2">
    <meta name="format-detection" content="telephone=no">
    <meta name="keywords" content="Construction, Renovation, Remodeling, Wisconsin, Edgerton">
    <meta name="description" content="View our completed residential and commercial renovation projects across Southern Wisconsin.">

    <title>Renovate | Our Projects</title>

    <!-- Existing Styles -->
    <link href='//fonts.googleapis.com/css?family=Raleway:100,300,400,500,600,700,900' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="style/reset.css">
    <link rel="stylesheet" type="text/css" href="style/superfish.css">
    <link rel="stylesheet" type="text/css" href="style/prettyPhoto.css">
    <link rel="stylesheet" type="text/css" href="style/jquery.qtip.css">
    <link rel="stylesheet" type="text/css" href="style/style.css">
    <link rel="stylesheet" type="text/css" href="style/animations.css">
    <link rel="stylesheet" type="text/css" href="style/responsive.css">

    <!-- Fonts -->
    <link rel="stylesheet" type="text/css" href="fonts/streamline-small/styles.css">
    <link rel="stylesheet" type="text/css" href="fonts/streamline-large/styles.css">
    <link rel="stylesheet" type="text/css" href="fonts/template/styles.css">
    <link rel="stylesheet" type="text/css" href="fonts/social/styles.css">
    <link rel="shortcut icon" href="images/favicon.ico">

    <!-- CUSTOM PURPLE STYLES + LOGO FIX -->
<style>
    .row.yellow, 
    .yellow.full-width, 
    .social-icons.yellow {
        background-color: #ff00ff !important;
        color: #ffffff !important;
    }

    .more, .more.simple, a.more, .button {
        background-color: #ff00ff !important;
        color: #ffffff !important;
        border: 2px solid #ff00ff !important;
    }

    .more:hover, .more.simple:hover, a.more:hover {
        background-color: #ffffff !important;
        color: #ff00ff !important;
    }

    /* Logo fix */
    .logo,
    .logo.vertical-align-cell,
    .header .logo {
        padding: 8px 0 !important;
        margin: 0 !important;
        height: auto !important;
    }

    .logo img {
        max-height: 175px !important;
        width: auto !important;
        margin: 0 auto !important;
    }

    .header-container,
    .header,
    .vertical-align-table {
        padding: 0 !important;
        min-height: auto !important;
    }

    .header-top-bar-container {
        margin-bottom: 0 !important;
    }

    /* ===== CENTER TITLE + CAROUSEL (SAFE VERSION) ===== */
    .page-header-left {
        text-align: center !important;
        float: none !important;
        width: 100% !important;
    }

    .page-header h1 {
        text-align: center !important;
    }

    .projects-carousel {
        margin: 40px auto 0 auto !important;
        max-width: 900px;          /* Adjust this number if you want it wider/narrower */
        position: relative !important;
    }
</style>
</head>
<body>

<body>
    <!-- ==================== NEW HEADER ==================== -->
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('afterbegin', data);
            })
            .catch(error => console.error('Error loading header:', error));
    </script>
    <!-- ==================================================== -->

    <!-- Your page content starts here -->

    <!-- Page Content -->
    <div class="theme-page padding-bottom-70">
        <div class="row gray full-width page-header vertical-align-table">
            <div class="row full-width padding-top-bottom-50 vertical-align-cell">
                <div class="row">
                    <div class="page-header-left" style="text-align: center; float: none; width: 100%;">
    <h1>OUR PROJECTS</h1>
</div>
                </div>
            </div>
        </div>

       <!-- Single Project Image -->
<div class="row" style="text-align: center; margin-top: 40px;">
    <a href="https://x.com/Onestudremodel" target="_blank" title="Follow us on X">
        <img src="images/samples/480x320/image_04.jpg" 
             alt="Recent Projects" 
             style="max-width: 900px; width: 100%; height: auto; display: inline-block;">
    </a>
</div>
</div>

<a href="#top" class="scroll-top animated-element template-arrow-up" title="Scroll to top"></a>

<!-- FOOTER -->
<script>
    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML('beforeend', data);
        })
        .catch(error => console.error('Error loading footer:', error));
</script>

<!-- Scripts -->
<script src="js/jquery-3.6.0.min.js"></script>
<script src="js/jquery.carouFredSel-6.2.1-packed.js"></script>
<script src="js/main.js"></script>

<script>
    $(function() {
        $('#projects-carousel').carouFredSel({
            items: 1,
            autoplay: true,
            timeoutDuration: 5000,
            prev: '.projects-prev',
            next: '.projects-next',
            pagination: true,
            responsive: true,
            scroll: {
                fx: "crossfade",
                duration: 800
            }
        });
    });
</script>

</body>
</html>
