<!DOCTYPE html>
<html>
<head>
    <title>One Stud Remodeling LLC | Contact Us</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.2" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="keywords" content="Construction, Renovation, Contact, Edgerton WI" />
    <meta name="description" content="Get in touch with One Stud Remodeling LLC for your next project." />

    <!-- Styles -->
    <link href='//fonts.googleapis.com/css?family=Raleway:100,300,400,500,600,700,900' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="style/reset.css">
    <link rel="stylesheet" type="text/css" href="style/superfish.css">
    <link rel="stylesheet" type="text/css" href="style/prettyPhoto.css">
    <link rel="stylesheet" type="text/css" href="style/jquery.qtip.css">
    <link rel="stylesheet" type="text/css" href="style/style.css">
    <link rel="stylesheet" type="text/css" href="style/animations.css">
    <link rel="stylesheet" type="text/css" href="style/responsive.css">

    <!-- Fonts -->
    <link rel="stylesheet" type="text/css" href="fonts/streamline-small/styles.css">
    <link rel="stylesheet" type="text/css" href="fonts/streamline-large/styles.css">
    <link rel="stylesheet" type="text/css" href="fonts/template/styles.css">
    <link rel="stylesheet" type="text/css" href="fonts/social/styles.css">
    <link rel="shortcut icon" href="images/favicon.ico">

   <!-- CUSTOM PURPLE STYLES + LOGO FIX + SPACE FIX -->
<style>
    .row.yellow, 
    .yellow.full-width, 
    .social-icons.yellow {
        background-color: #ff00ff !important;
        color: #ffffff !important;
    }

    .more, .more.simple, a.more, .button {
        background-color: #ff00ff !important;
        color: #ffffff !important;
    }

    .more:hover, .more.simple:hover, a.more:hover {
        background-color: #ffffff !important;
        color: #ff00ff !important;
    }

    .logo img {
        max-height: 175px !important;
        width: auto !important;
    }

    /* === FIX THE LARGE SPACE === */
    .contact-map {
        height: 110px !important;   /* Change this number to control map size */
        max-height: 110px !important;
    }

    .page-margin-top {
        margin-top: 20px !important; /* Reduces the big gap under the map */
    }

    .theme-page {
        padding-top: 0 !important;
    }
</style>
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('afterbegin', data);
            })
            .catch(error => console.error('Error loading header:', error));
    </script>
    <!-- ================================================ -->

    <!-- CONTACT PAGE CONTENT -->
    <div class="theme-page">
        <div class="row full-width">
            <div class="contact-map" id="map" data-scroll-wheel="0" data-draggable="0"></div>
        </div>

        

        <div class="row page-margin-top">
            <form class="contact-form" id="contact-form" method="post" action="https://formsubmit.co/Carlos@onestudremodeling.com">
                <div class="row">
                    <fieldset class="column column-1-2">
                        <input class="text-input" name="name" type="text" placeholder="Your Name *">
                        <input class="text-input" name="email" type="text" placeholder="Your Email *">
                        <input class="text-input" name="phone" type="text" placeholder="Your Phone">
                    </fieldset>
                    <fieldset class="column column-1-2">
                        <textarea name="message" placeholder="Message *"></textarea>
                    </fieldset>
                </div>
                <div class="row margin-top-30">
                    <div class="column column-1-2">
                        <p class="description t1">We typically reply within one business day.</p>
                    </div>
                    <div class="column column-1-2 align-right">
                        <input type="hidden" name="action" value="contact_form" />
                        <input type="submit" name="submit" value="SEND MESSAGE" class="more active">
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>

</body>
</html>
